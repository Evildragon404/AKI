<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | {{ site_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a12;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

        .card{position:relative;z-index:10;background:rgba(10,10,20,0.85);backdrop-filter:blur(20px);border:2px solid {{ theme_color }};border-radius:20px;padding:48px 40px;text-align:center;max-width:420px;box-shadow:0 0 60px {{ theme_color }}22}
        .icon{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 0 20px {{ theme_color }})}
        .title{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:{{ theme_color }};letter-spacing:4px;text-shadow:0 0 20px {{ theme_color }};margin-bottom:8px}
        .sub{font-size:14px;color:{{ theme_color }}66;letter-spacing:3px;margin-bottom:24px;font-weight:300}
        .message{background:rgba(0,0,0,0.5);border:2px solid {{ theme_color }}44;border-radius:12px;padding:16px 20px;font-size:15px;color:#d1d5db;line-height:1.6;margin-bottom:24px;font-weight:400}
        .footer{font-size:12px;color:{{ theme_color }}66;letter-spacing:2px;font-weight:300}
    </style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
</head>
<body>
<div class="card">
        <div class="icon">🔧</div>
        <div class="title">MAINTENANCE</div>
        <div class="sub">{{ site_name }} • SYSTEMS OFFLINE</div>
        <div class="message">{{ message }}</div>
        <div class="footer">⏳ PLEASE CHECK BACK LATER</div>
    </div>
</body>
</html>
