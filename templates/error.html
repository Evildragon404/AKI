<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>Server error — TEAM AKI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.error-card{max-width:540px;padding:34px;border:1px solid var(--aki-edge);border-radius:25px;background:var(--aki-glass);box-shadow:var(--aki-shadow);text-align:center}.error-card h1{font-size:26px;margin:0 0 12px}.error-card p{color:var(--aki-muted);font-size:13px;line-height:1.6}.error-card code{color:var(--aki-accent)}</style>
</head>
<body><main class="error-card"><h1>Something went wrong</h1><p>The application recorded this error for administrator review. Please retry the action. If it continues, share the reference ID with your administrator.</p><p>Reference: <code>{{ request_id }}</code></p><a class="btn" href="{{ url_for('landing') }}">Return home</a></main></body>
</html>
